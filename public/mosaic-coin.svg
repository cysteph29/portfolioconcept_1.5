<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title">
  <title>Mosaic coin texture</title>
  <defs>
    <pattern id="mosaic" width="64" height="64" patternUnits="userSpaceOnUse">
      <rect width="64" height="64" fill="#f6ece4" />
      <rect x="0" y="0" width="32" height="32" fill="#194b22" />
      <rect x="32" y="0" width="32" height="32" fill="#fbf582" />
      <rect x="0" y="32" width="32" height="32" fill="#b9cfff" />
      <rect x="32" y="32" width="32" height="32" fill="#211217" />
    </pattern>
    <radialGradient id="shine" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42" />
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#mosaic)" />
  <rect width="512" height="512" fill="url(#shine)" />
</svg>
